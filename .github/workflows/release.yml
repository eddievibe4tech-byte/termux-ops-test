name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        run: |
          set -e
          for pair in linux/amd64 linux/arm64; do
            os=${pair%/*}; arch=${pair#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o dist/hlops-$os-$arch ./cmd/hlops
          done
      - name: Checksums
        run: |
          cd dist
          sha256sum hlops-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
